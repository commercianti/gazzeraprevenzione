<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ottobre Rosa 2026 - Gazzera per la Prevenzione</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #fce4ec;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Schermata iniziale per attivare l'audio ed entrare */
        #start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #e6007e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .btn-start {
            background-color: white;
            color: #e6007e;
            border: none;
            padding: 18px 36px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }

        .btn-start:hover {
            transform: scale(1.05);
        }

        /* Contenitore Immagine Manifesto */
        .poster-container {
            max-width: 900px;
            width: 95%;
            margin: 20px auto 80px auto;
            text-align: center;
        }

        .poster-img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            display: block;
        }

        /* Lettore e comandi audio in basso */
        .audio-bar {
            position: fixed;
            bottom: 15px;
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 20px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 15px;
            border: 2px solid #e6007e;
        }

        .play-btn {
            background: #e6007e;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Schermata di Benvenuto -->
    <div id="start-overlay">
        <h1>🌸 OTTOBRE ROSA 2026 🌸</h1>
        <p style="margin-top: 10px; font-size: 1.1rem;">Gazzera per la Prevenzione</p>
        <button class="btn-start" onclick="avviaPagina()">▶ CLICCA QUI PER APRIRE</button>
    </div>

    <!-- Manifesto dell'iniziativa -->
    <div class="poster-container">
        <!-- Verifica che il nome della foto su GitHub sia esatto -->
        <img src="volantino.jpg" alt="Manifesto Ottobre Rosa 2026" class="poster-img" id="manifestoImg">
    </div>

    <!-- Barra Musica -->
    <div class="audio-bar">
        <button class="play-btn" id="audioToggleBtn" onclick="toggleAudio()">⏸</button>
        <span style="font-weight: bold; color: #e6007e; font-size: 0.9rem;">🎵 Musica in riproduzione</span>
    </div>

    <!-- Elemento Audio -->
    <audio id="musicaSfondo" loop>
        <source src="https://github.com/commercianti/gazzeraprevenzione/raw/refs/heads/main/Il_nostro_patto_di_cuore.mp3" type="audio/mpeg">
    </audio>

    <script>
        const audio = document.getElementById('musicaSfondo');
        const overlay = document.getElementById('start-overlay');
        const btnAudio = document.getElementById('audioToggleBtn');

        function avviaPagina() {
            // Nasconde la schermata iniziale
            overlay.style.display = 'none';
            // Fa partire la musica
            audio.play().catch(function(error) {
                console.log("Impossibile riprodurre l'audio:", error);
            });
        }

        function toggleAudio() {
            if (audio.paused) {
                audio.play();
                btnAudio.textContent = '⏸';
            } else {
                audio.pause();
                btnAudio.textContent = '▶';
            }
        }
    </script>
</body>
</html>
