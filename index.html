<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ottobre Rosa 2026 - Gazzera per la Prevenzione</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f0f12;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* Overlay di benvenuto per sbloccare l'audio */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 15, 18, 0.96);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            backdrop-filter: blur(10px);
            transition: opacity 0.5s ease, visibility 0.5s ease;
            padding: 20px;
            text-align: center;
        }

        .overlay.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .overlay h1 {
            color: #ff4081;
            font-size: 2.2rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .overlay p {
            color: #e0e0e0;
            font-size: 1.1rem;
            margin-bottom: 30px;
            max-width: 500px;
        }

        .btn-start {
            background: linear-gradient(135deg, #ff4081, #d81b60);
            color: white;
            border: none;
            padding: 16px 36px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 64, 129, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-start:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 64, 129, 0.8);
        }

        /* Contenitore principale */
        .main-container {
            width: 100%;
            max-width: 900px;
            padding: 20px 15px 100px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Immagine del manifesto */
        .poster-wrapper {
            width: 100%;
            background: #1a1a24;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(255, 64, 129, 0.15);
            border: 1px solid rgba(255, 64, 129, 0.2);
            text-align: center;
        }

        .poster-wrapper img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Barra audio fluttuante in basso */
        .audio-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 40px);
            max-width: 600px;
            background: rgba(26, 26, 36, 0.95);
            border: 1px solid rgba(255, 64, 129, 0.4);
            border-radius: 50px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .audio-info {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ff80ab;
            font-size: 0.9rem;
            font-weight: 600;
            white-space: nowrap;
        }

        audio {
            width: 100%;
            height: 36px;
        }

        /* Personalizzazione player audio per dark mode */
        audio::-webkit-media-controls-panel {
            background-color: transparent;
        }
    </style>
</head>
<body>

    <!-- Overlay per l'attivazione audio -->
    <div class="overlay" id="overlay">
        <h1>Ottobre Rosa 2026</h1>
        <p>Gazzera per la Prevenzione<br>Clicca qui sotto per aprire il manifesto e ascoltare il jingle dedicato.</p>
        <button class="btn-start" onclick="startExperience()">
            ▶ ENTRA E ASCOLTA
        </button>
    </div>

    <!-- Contenuto principale con il manifesto -->
    <div class="main-container">
        <div class="poster-wrapper">
            <img src="volantino.jpg" alt="Manifesto Ottobre Rosa 2026 Gazzera">
        </div>
    </div>

    <!-- Player audio fisso in basso -->
    <div class="audio-bar">
        <div class="audio-info">
            🎵 Jingle Ottobre Rosa
        </div>
        <audio id="bgAudio" controls loop preload="auto">
            <source src="musica.mp3" type="audio/mpeg">
            Il tuo browser non supporta il riproduttore audio.
        </audio>
    </div>

    <script>
        function startExperience() {
            var audio = document.getElementById('bgAudio');
            var overlay = document.getElementById('overlay');
            
            // Avvia la musica
            audio.play().catch(function(error) {
                console.log("Autoplay bloccato dal browser: ", error);
            });
            
            // Nasconde l'overlay
            overlay.classList.add('hidden');
        }
    </script>

</body>
</html>
